<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reads - Login / Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-brand">
            <h1 class="auth-logo">CampusReads</h1>
            <p class="auth-tagline">Books that power student life</p>
        </div>

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTabBtn" onclick="showLoginForm()">Login</button>
                <button class="auth-tab" id="registerTabBtn" onclick="showRegisterForm()">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginFormContainer" class="auth-form-container active">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to continue to CampusReads</p>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="your.email@vitstudent.ac.in" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="pw-wrap">
                            <input type="password" id="loginPassword" placeholder="••••••••" required>
                            <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)">👁</button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox">
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
                </form>
                
                <div id="loginMessage" class="auth-message"></div>
                
                <p class="auth-switch">
                    Don't have an account? 
                    <a href="#" onclick="showRegisterForm(); return false;">Create one</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" class="auth-form-container">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join CampusReads today</p>
                
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" placeholder="John Doe" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" placeholder="your.email@vitstudent.ac.in" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="9876543210" pattern="[0-9]{10}" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <div class="pw-wrap">
                                <input type="password" id="regPassword" placeholder="Min. 6 characters" minlength="6" required>
                                <button type="button" class="pw-toggle" onclick="togglePw('regPassword', this)">👁</button>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="regConfirmPassword">Confirm Password</label>
                            <div class="pw-wrap">
                                <input type="password" id="regConfirmPassword" placeholder="Re-enter password" minlength="6" required>
                                <button type="button" class="pw-toggle" onclick="togglePw('regConfirmPassword', this)">👁</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group terms">
                        <label class="checkbox">
                            <input type="checkbox" required> I agree to the 
                            <a href="#">Terms of Service</a> and 
                            <a href="#">Privacy Policy</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="auth-btn" id="registerBtn">Create Account</button>
                </form>
                
                <div id="registerMessage" class="auth-message"></div>
                
                <p class="auth-switch">
                    Already have an account? 
                    <a href="#" onclick="showLoginForm(); return false;">Sign in</a>
                </p>
            </div>
        </div>

        <div class="auth-footer">
            <p>&copy; 2026 CampusReads. All rights reserved. | Srijani Das | 24BCE1170</p>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="auth.js"></script>
</body>
</html>
